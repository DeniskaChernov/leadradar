name: CI

on:
  push:
  pull_request:

jobs:
  offline-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      EXTERNAL_KILL_SWITCH: "true"
      OPENAI_LIVE_CALLS_ENABLED: "false"
      INSTAGRAM_LIVE_CALLS_ENABLED: "false"
      LEAD_SEARCH_ENABLED: "false"
      MONITOR_SCHEDULE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m compileall -q app alembic tests
      - run: python -m alembic upgrade head
      - run: python -m alembic upgrade head
      - name: Upgrade an existing pre-Phase-B database twice
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./ci-existing.db python -m alembic upgrade a6d4e2c91f30
          DATABASE_URL=sqlite+aiosqlite:///./ci-existing.db python -m alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./ci-existing.db python -m alembic upgrade head
      - run: python -m pytest -q
