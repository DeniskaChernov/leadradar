<article class="radar-comment-card" data-comment-id="{{ comment.id }}">
  <header><a href="/contacts/{{ contact.id }}"><b>@{{ contact.username }}</b></a><small>{{ (comment.created_at_platform or comment.discovered_at) | display_dt }}</small></header>
  <p>{{ comment.text or 'Пустой комментарий' }}</p>
  <span class="tag neutral">{{ 'Отсеян · не лид' if lead else 'Комментарий без оценки' }}</span>
  {% if lead %}<a class="btn tiny ghost" href="/leads/{{ lead.id }}">Посмотреть оценку</a>{% else %}<a class="btn tiny ghost" href="/contacts/{{ contact.id }}">Карточка клиента</a>{% endif %}
</article>
