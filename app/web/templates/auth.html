<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f1f5f9">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>Вход · Lead Radar</title>
  <script async id="telegram-sdk" src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="optional-fonts" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print">
  <link rel="stylesheet" href="/static/app.css?v=13.56.0-cloudflare-20261007-hot">
  <script defer src="/static/app.js?v=13.56.0-cloudflare-20261007-hot"></script>
</head>
<body class="auth-page" data-auth-page="1">
  <main class="auth-shell" data-motion-root>
    <span class="eyebrow">ВАШ РАБОЧИЙ КАБИНЕТ</span>
    <div class="brand-mark large" aria-hidden="true"><i data-lucide="radar">LR</i></div>
    <h1>Lead Radar</h1>
    <p>Находите людей, которым нужна мебель — и ведите их до сделки. Войдите, чтобы запустить поиск и открыть CRM.</p>
    {% if settings.web_password_hash %}
    <form class="password-login" data-password-login>
      <label for="radar-password">Пароль доступа</label>
      <input id="radar-password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <button class="btn primary" type="submit">Войти в Lead Radar</button>
      <p data-login-error role="alert"></p>
    </form>
    {% endif %}
    <div id="auth-status" class="auth-status">Проверяем Telegram…</div>
    <button class="btn primary" type="button" data-auth-retry>Повторить вход</button>
  </main>
</body>
</html>
